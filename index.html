<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Γεωργία & Χαράλαμπος — Γάμος</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;500&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --olive: #4a5240;
    --olive-dark: #323826;
    --olive-mid: #5c6350;
    --olive-light: #7a8560;
    --gold: #c9a96e;
    --gold-light: #e8d4a8;
    --cream: #f5f0e8;
    --deep: #1e2118;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--olive-dark);
    color: var(--cream);
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow-x: hidden;
  }

  .hero-top {
    background: var(--olive-dark);
    text-align: center;
    padding: 3.5rem 2rem 2.5rem;
    animation: fadeUp 1.2s ease both;
  }

  .hero-eyebrow {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 0.7rem;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--gold-light);
    margin-bottom: 1.2rem;
    opacity: 0.8;
  }

  .hero-names {
    font-family: 'Cinzel', serif;
    font-size: clamp(2.4rem, 7vw, 5rem);
    font-weight: 400;
    color: #fff;
    line-height: 1.1;
    letter-spacing: 0.06em;
  }

  .hero-ampersand {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1.8rem, 5vw, 3.5rem);
    color: var(--gold);
    line-height: 1;
    margin: 0.15em 0;
  }

  .hero-location {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    letter-spacing: 0.22em;
    font-size: 0.75rem;
    color: var(--gold-light);
    margin-top: 1.3rem;
    opacity: 0.7;
  }

  .gold-line {
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin: 1.5rem auto 0;
    opacity: 0.6;
  }

  .hero-photo-wrap {
    width: 100%;
    height: 70vh;
    overflow: hidden;
    display: block;
  }

  .hero-photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 75%;
    transform: scale(2.2);
    transform-origin: center 72%;
    display: block;
  }

  .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 2.2rem 2rem;
    color: var(--gold);
  }
  .ornament::before, .ornament::after {
    content: '';
    flex: 1;
    max-width: 100px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold));
  }
  .ornament::after { background: linear-gradient(to left, transparent, var(--gold)); }

  .invite-section {
    max-width: 680px;
    margin: 0 auto;
    padding: 1rem 2rem 1rem;
    text-align: center;
  }
  .section-label {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 0.68rem;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.5rem;
  }
  .invite-text {
    font-size: clamp(1.05rem, 2.5vw, 1.25rem);
    font-weight: 300;
    line-height: 2;
    color: rgba(245,240,232,0.75);
  }
  .invite-text strong {
    font-weight: 400;
    color: #fff;
  }

  .program-section {
    max-width: 860px;
    margin: 0 auto;
    padding: 1rem 2rem 5rem;
  }
  .program-title {
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: clamp(1rem, 3vw, 1.4rem);
    letter-spacing: 0.18em;
    color: #fff;
    margin-bottom: 0.5rem;
  }
  .cards-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.8rem;
    margin-top: 2.5rem;
  }
  @media (max-width: 640px) {
    .cards-grid { grid-template-columns: 1fr; }
  }
  .event-card {
    background: var(--olive);
    border: 1px solid rgba(201,169,110,0.2);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 4px 30px rgba(0,0,0,0.25);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .event-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  .card-header {
    background: linear-gradient(135deg, var(--gold) 0%, #a87840 100%);
    padding: 1.3rem 1.5rem 1rem;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .card-icon { font-size: 1.7rem; line-height: 1; }
  .card-header-text { flex: 1; }
  .card-type {
    font-family: 'Raleway', sans-serif;
    font-size: 0.62rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.85;
    margin-bottom: 0.2rem;
  }
  .card-name {
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    font-weight: 500;
    line-height: 1.3;
  }
  .card-body { padding: 1.3rem 1.5rem; }
  .card-time {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    color: var(--gold);
    margin-bottom: 0.8rem;
  }
  .card-address {
    font-size: 0.92rem;
    color: rgba(245,240,232,0.65);
    line-height: 1.7;
    font-style: italic;
  }
  .map-wrapper {
    border-top: 1px solid rgba(201,169,110,0.15);
    margin-top: 1rem;
    height: 190px;
    overflow: hidden;
  }
  .map-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
    filter: sepia(30%) saturate(70%) brightness(0.85);
  }
  .map-link {
    display: block;
    text-align: center;
    padding: 0.7rem;
    font-family: 'Raleway', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    text-decoration: none;
    background: rgba(201,169,110,0.07);
    border-top: 1px solid rgba(201,169,110,0.12);
    transition: background 0.2s;
  }
  .map-link:hover { background: rgba(201,169,110,0.16); }

  .footer {
    text-align: center;
    padding: 4rem 2rem 5rem;
    background: var(--deep);
    color: var(--gold-light);
    border-top: 1px solid rgba(201,169,110,0.15);
  }
  .footer-names {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.3rem, 4vw, 2rem);
    letter-spacing: 0.12em;
    color: #fff;
    margin-bottom: 0.5rem;
  }
  .footer-location {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    letter-spacing: 0.25em;
    font-size: 0.72rem;
    opacity: 0.6;
    margin-bottom: 2rem;
  }
  .footer-msg {
    font-size: 1rem;
    font-style: italic;
    opacity: 0.55;
    font-weight: 300;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-in {
    opacity: 0;
    transform: translateY(22px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .fade-in.visible {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>

<div class="hero-top">
  <p class="hero-eyebrow">Σας προσκαλούμε στον γάμο μας</p>
  <h1 class="hero-names">
    Χαράλαμπος
    <span class="hero-ampersand">&amp;</span>
    Γεωργία
  </h1>
  <p class="hero-location">Σούνι · Κύπρος</p>
  <div class="gold-line"></div>
</div>

<div class="hero-photo-wrap">

</div>

<div class="ornament">✦</div>

<section class="invite-section fade-in">
  <p class="section-label">Πρόσκληση</p>
  <p class="invite-text">
    Με πολλή χαρά σας προσκαλούμε να μοιραστείτε μαζί μας αυτή τη
    <strong>ξεχωριστή</strong> μέρα.
  </p>
</section>

<section class="program-section fade-in" id="program">
  <h2 class="program-title">ΠΡΟΓΡΑΜΜΑ</h2>
  <div class="cards-grid">
    <div class="event-card">
      <div class="card-header">
        <div class="card-icon">🤵</div>
        <div class="card-header-text">
          <div class="card-type">Ζόμωμα</div>
          <div class="card-name">Γαμπρός</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-time">13:30</div>
        <div class="card-address"></div>
      </div>
    </div>

    <div class="event-card">
      <div class="card-header">
        <div class="card-icon">👰</div>
        <div class="card-header-text">
          <div class="card-type">Ζόμωμα</div>
          <div class="card-name">Νύφη</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-time">15:30</div>
        <div class="card-address"></div>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="footer-names">Χαράλαμπος & Γεωργία</div>
  <div class="footer-location">Σούνι · Κύπρος</div>
  <div class="footer-msg">Σας περιμένουμε με αγάπη</div>
</footer>

<script>
  const observer = new IntersectionObserver(
    entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }),
    { threshold: 0.15 }
  );
  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
</script>

<div id="yt-player" style="position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;align-items:center;gap:6px;">
  <div id="player" style="display:none;"></div>
  <button id="music-btn" onclick="toggleMusic()" style="background:rgba(201,169,110,0.9);border:none;border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:1.2rem;box-shadow:0 2px 12px rgba(0,0,0,0.3);color:#fff;">♫</button>
  <span style="font-family:Raleway,sans-serif;font-size:0.55rem;letter-spacing:0.15em;color:rgba(201,169,110,0.8);text-transform:uppercase;">Μουσική</span>
</div>

<script>
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  var player;
  var isPlaying = false;
  var isReady = false;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '0',
      width: '0',
      videoId: 'FIewcAIu4IQ',
      playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': 'FIewcAIu4IQ' },
      events: {
        'onReady': function(e) { isReady = true; }
      }
    });
  }

  function toggleMusic() {
    if (!isReady) return;
    var btn = document.getElementById('music-btn');
    if (isPlaying) {
      player.pauseVideo();
      btn.textContent = '♫';
      btn.style.opacity = '0.6';
      isPlaying = false;
    } else {
      player.playVideo();
      btn.textContent = '⏸';
      btn.style.opacity = '1';
      isPlaying = true;
    }
  }
</script>

</body>
</html>
